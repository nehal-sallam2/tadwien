<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tadwein Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 25px 15px;
        min-height: 100vh;
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, #fff5f5, #fce8eb);
        color: #492b32;
      }

      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        text-align: center;
      }

      .card {
        background: #fff;
        padding: 25px;
        border-radius: 22px;
        box-shadow: 0 8px 35px rgba(100, 35, 50, 0.1);
      }

      .inv {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 14px;
        margin-bottom: 25px;
      }

      h1 {
        color: #9f344b;
        font-size: 25px;
        margin: 10px 0 25px;
      }

      label {
        display: block;
        text-align: left;
        font-weight: 700;
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #e6cbd1;
        border-radius: 12px;
        font-family: inherit;
        font-size: 16px;
        outline: none;
        margin-bottom: 18px;
      }

      input:focus {
        border-color: #a83d55;
        box-shadow: 0 0 0 3px rgba(168, 61, 85, 0.1);
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 13px 10px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .yes {
        background: #9f344b;
        color: white;
      }

      .no {
        background: #f5e7ea;
        color: #843044;
      }

      #result {
        display: none;
        margin-top: 24px;
        padding: 20px;
        border-radius: 15px;
        background: #fff7f8;
        line-height: 1.9;
      }

      #result h2 {
        color: #9f344b;
        font-size: 21px;
      }

      #qrcode {
        display: flex;
        justify-content: center;
        margin: 20px auto;
        padding: 12px;
        background: white;
        width: fit-content;
        border: 1px solid #eee;
        border-radius: 12px;
      }

      #qrcode img,
      #qrcode canvas {
        display: block;
      }

      .small {
        color: #80656b;
        font-size: 13px;
      }

      .error {
        color: #b42335;
        font-weight: 700;
      }

      @media (max-width: 420px) {
        .card {
          padding: 17px;
        }

        h1 {
          font-size: 21px;
        }

        .buttons {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <section class="card">
        <img class="inv" src="invitation.jpg" alt="Tadwein Invitation" />

        <form id="rsvpForm">
          <h1>We Would Love to Have You With Us!</h1>

          <label for="name">Full Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            maxlength="100"
            required
          />

          <div class="buttons">
            <button type="button" class="yes" id="yesBtn">
              Confirm Attendance
            </button>

            <button type="button" class="no" id="noBtn">
              Regretfully Decline
            </button>
          </div>
        </form>

        <div id="result" aria-live="polite"></div>
      </section>
    </main>

    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbw07kddO-0YQYyusuMDy9X0hiExYB6nZjnnm8HGXGJ6O9Y3d8AI1al8j89jPKTThext/exec";

      const form = document.getElementById("rsvpForm");
      const nameInput = document.getElementById("name");
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");
      const result = document.getElementById("result");

      function createId() {
        if (window.crypto && crypto.randomUUID) {
          return crypto.randomUUID();
        }

        return (
          "TDW-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10)
        );
      }

      function escapeHTML(value) {
        return value.replace(/[&<>"']/g, function (char) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[char];
        });
      }

      async function submitResponse(response) {
        const name = nameInput.value.trim();

        if (!name || name.length < 3) {
          alert("Please enter your full name.");
          nameInput.focus();
          return;
        }

        yesBtn.disabled = true;
        noBtn.disabled = true;

        result.style.display = "block";
        result.textContent = "Submitting your response...";

        const id = createId();

        const data = new URLSearchParams();
        data.append("name", name);
        data.append("id", id);
        data.append("response", response);

        try {
          await fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: data,
          });

          form.style.display = "none";

          if (response === "yes") {
            result.innerHTML = `
            <h2>Thank You, ${escapeHTML(name)}! 🤍</h2>
            <p>
              Your attendance has been confirmed!
              Please save your QR code and present it at the entrance
              on the event day.
            </p>

            <div id="qrcode"></div>

            <p class="small">
              This QR code is your personal entry pass.
            </p>
          `;

            const qrUrl = SCRIPT_URL + "?id=" + encodeURIComponent(id);

            new QRCode(document.getElementById("qrcode"), {
              text: qrUrl,
              width: 190,
              height: 190,
              correctLevel: QRCode.CorrectLevel.H,
            });
          } else {
            result.innerHTML = `
            <h2>Thank You! 🤍</h2>
            <p>
              Your response has been recorded.
              We're sorry you won't be able to join us!
            </p>
          `;
          }
        } catch (error) {
          result.innerHTML = `
          <p class="error">
            Something went wrong while submitting your response.
            Please try again.
          </p>
        `;

          yesBtn.disabled = false;
          noBtn.disabled = false;
        }
      }

      yesBtn.addEventListener("click", function () {
        submitResponse("yes");
      });

      noBtn.addEventListener("click", function () {
        submitResponse("no");
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
      });
    </script>
  </body>
</html>
